name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract tests
        run: npm run contracts:test
      - name: Unit tests
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
