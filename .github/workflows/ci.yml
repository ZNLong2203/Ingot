name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 22) reads
      # optional wasm dependencies differently and refuses it.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Contract tests
        run: npm run contracts:test
      - name: Unit tests
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
